# ~/.config/kitty/kitty.conf
# 高性能 + 开发向。配色/字体对齐 wezterm（Nord + MonoLisa）。
# 文档：https://sw.kovidgoyal.net/kitty/conf/

# ──────────────────────────────────────────────────────────────
# 字体：MonoLisa Medium，nerd 图标由 kitty 内置 symbols 兜底
# ──────────────────────────────────────────────────────────────
font_family      family="MonoLisa" style="Medium"
bold_font        family="MonoLisa" style="Bold"
italic_font      family="MonoLisa" style="Medium Italic"
bold_italic_font family="MonoLisa" style="Bold Italic"
font_size 13.0

# 行距收紧到 95%（对齐 wezterm line_height 0.95）
modify_font cell_height 95%

# MonoLisa 自带连字（=> -> != 等）；只在光标所在格关闭，方便看清单字符
disable_ligatures cursor

# ──────────────────────────────────────────────────────────────
# 配色：Nord
# ──────────────────────────────────────────────────────────────
include nord.conf

# ──────────────────────────────────────────────────────────────
# 性能：GPU 渲染（macOS 走 Metal）。降低重绘/输入延迟，跟随屏幕刷新
# ──────────────────────────────────────────────────────────────
sync_to_monitor yes
repaint_delay   8
input_delay     2
# 闲置时不重绘（光标停止闪烁后 GPU 静默）
wheel_scroll_multiplier 4.0

# ──────────────────────────────────────────────────────────────
# 光标
# ──────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0

# ──────────────────────────────────────────────────────────────
# 回滚 & 铃声
# ──────────────────────────────────────────────────────────────
scrollback_lines 100000
enable_audio_bell no
# Ctrl+Shift+H 把回滚缓冲丢进 pager（默认用 less，已配 -R）
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ──────────────────────────────────────────────────────────────
# 鼠标 & 选择
# ──────────────────────────────────────────────────────────────
mouse_hide_wait 2.0
copy_on_select   yes
strip_trailing_spaces smart
# 双击选词时把这些算进边界（路径/参数整段选中）
select_by_word_characters @-./_~?&=%+#

# ──────────────────────────────────────────────────────────────
# 窗口 & 外观（macOS 原生圆角 + 交通灯）
# ──────────────────────────────────────────────────────────────
remember_window_size  no
initial_window_width  120c
initial_window_height 36c
window_padding_width  10 12
hide_window_decorations no
macos_titlebar_color  background
macos_show_window_title_in window
macos_quit_when_last_window_closed no
# 退出无确认弹窗
confirm_os_window_close 0

# ──────────────────────────────────────────────────────────────
# 标签栏
# ──────────────────────────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  " {index}  {title} "

# ──────────────────────────────────────────────────────────────
# 分屏布局：splits（可任意切分）+ stack（zoom 全屏单窗）
# ──────────────────────────────────────────────────────────────
enabled_layouts splits,stack

# ──────────────────────────────────────────────────────────────
# Shell 集成（自动，提供 cwd 报告 / 命令跳转 / 提示符标记）
# ──────────────────────────────────────────────────────────────
shell_integration enabled

# ──────────────────────────────────────────────────────────────
# 快捷键
#   kitty_mod = Ctrl+Shift（kitty 默认），叠加 macOS 习惯的 CMD 系
#   注意：不劫持 Ctrl+a，保留给 readline 行首
# ──────────────────────────────────────────────────────────────
kitty_mod ctrl+shift

# —— 分屏（CMD+d 左右，CMD+Shift+d 上下，类 iTerm/wezterm）——
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
# 关闭当前窗（分屏）
map cmd+shift+w close_window

# —— 窗口（分屏）焦点切换：vim hjkl ——
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
# CMD+Option+方向键 也能切（对齐 wezterm）
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down

# —— 窗口尺寸调整（kitty_mod + Shift + hjkl）——
map kitty_mod+shift+h resize_window narrower
map kitty_mod+shift+l resize_window wider
map kitty_mod+shift+k resize_window taller
map kitty_mod+shift+j resize_window shorter
map kitty_mod+shift+0 resize_window reset

# —— zoom：当前窗全屏（stack 布局切换）——
map kitty_mod+z toggle_layout stack

# —— 标签页 ——
map cmd+t       new_tab_with_cwd
map cmd+w       close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# —— 字号 ——
map cmd+equal     change_font_size all +0.5
map cmd+minus     change_font_size all -0.5
map cmd+0         change_font_size all 0

# —— 清屏 + 清回滚（CMD+k，iTerm 肌肉记忆）——
map cmd+k clear_terminal scrollback active

# —— 全屏（CMD+Ctrl+F，macOS 习惯）——
map cmd+ctrl+f toggle_fullscreen

# —— 快速选择/打开 URL：hint 选屏上链接 ——
map kitty_mod+e open_url_with_hints
# hint 选路径并粘贴
map kitty_mod+p>f kitten hints --type path --program -

# —— 重载配置 ——
map cmd+ctrl+comma load_config_file
