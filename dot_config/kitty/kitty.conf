# ~/.config/kitty/kitty.conf
# 对齐 ghostty 配置（GitHub Dark Dimmed + Berkeley Mono / Sarasa Mono SC，11pt，
# 标题栏合并 tab，启动最大化，Shift+Enter 换行），目标：最佳性能 + 顺手。
# 文档：https://sw.kovidgoyal.net/kitty/conf/
# 旧版（wezterm Nord + MonoLisa）备份在 kitty.conf.wezterm-nord.bak

# ──────────────────────────────────────────────────────────────
# 字体（ghostty: Berkeley Mono → Sarasa Mono SC → Symbols Nerd Font）
#   - 主字体 Berkeley Mono；粗/斜体指向真实字重，不合成（font-synthetic-style=false）
#   - CJK 走 symbol_map 强制落到 Sarasa Mono SC（2:1 等宽，中文不抖）
#   - Nerd 图标：kitty 自带 NerdFontsSymbolsOnly 回退，系统未装也能显示
# ──────────────────────────────────────────────────────────────
font_family      family="Berkeley Mono" style="Regular"
bold_font        family="Berkeley Mono" style="Bold"
italic_font      family="Berkeley Mono" style="Oblique"
bold_italic_font family="Berkeley Mono" style="Bold Oblique"
font_size 11.0

# CJK 统一 / 全角标点 / 假名 / 扩展区 → Sarasa Mono SC
symbol_map U+3000-U+30FF,U+31F0-U+31FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF,U+20000-U+2FA1F Sarasa Mono SC

# 光标所在格关闭连字，方便看清单字符
disable_ligatures cursor
# 文本合成按平台习惯（macOS 上笔画更接近原生）
text_composition_strategy platform

# ──────────────────────────────────────────────────────────────
# 配色：GitHub Dark Dimmed（与 ghostty 同源）
# ──────────────────────────────────────────────────────────────
include github-dark-dimmed.conf

# ──────────────────────────────────────────────────────────────
# 性能：Metal GPU 渲染；重绘跟屏幕刷新率，输入延迟压到最低
# ──────────────────────────────────────────────────────────────
sync_to_monitor yes
repaint_delay   8
input_delay     0
scrollback_lines 100000
# 回滚在 pager 里翻：内存上限（MB），放大点保证 100k 行不截断
scrollback_pager_history_size 64
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 2.0

# ──────────────────────────────────────────────────────────────
# 光标 / 铃声
# ──────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes

# ──────────────────────────────────────────────────────────────
# 鼠标 & 选择
# ──────────────────────────────────────────────────────────────
mouse_hide_wait 2.0
copy_on_select yes
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#
# 回滚 pager
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ──────────────────────────────────────────────────────────────
# 窗口（ghostty: maximize + macos-titlebar-style=tabs）
#   - 最大化由 startup.session 里的 os_window_state 实现
#   - kitty 无法把 tab 嵌进原生标题栏；保留标题栏（可拖动），把它染成 tab 栏同色，
#     标题栏 + tab 栏视觉上合成一整块深色 header
# ──────────────────────────────────────────────────────────────
startup_session startup.session
remember_window_size no
window_padding_width 4 8
macos_titlebar_color background
macos_show_window_title_in none
macos_quit_when_last_window_closed no
macos_option_as_alt no
confirm_os_window_close 0

# ──────────────────────────────────────────────────────────────
# 标签栏
# ──────────────────────────────────────────────────────────────
tab_bar_edge        bottom
tab_bar_style       separator
tab_separator       "  "
tab_bar_align       left
tab_bar_min_tabs    1
tab_bar_margin_width  6
tab_bar_margin_height 4 0
tab_title_template  " {index}  {title} "
active_tab_font_style   bold
inactive_tab_font_style normal
# 三层色阶：栏底 < 非活动 tab < 活动 tab，块之间靠 separator 留空
tab_bar_background      #1c2128
inactive_tab_background #22272e
inactive_tab_foreground #768390
active_tab_background   #2d333b
active_tab_foreground   #cdd9e5

# ──────────────────────────────────────────────────────────────
# 分屏布局：splits（任意切分）+ stack（单窗 zoom）
# ──────────────────────────────────────────────────────────────
enabled_layouts splits,stack

# ──────────────────────────────────────────────────────────────
# Shell 集成 & 远程控制
#   ghostty shell-integration-features=ssh-env → 这里用 kitten ssh
#   （`kitten ssh host` 会把 shell 集成与 TERM 一起带到远端）
#   remote control 开 socket，方便脚本/nvim 调 kitty
# ──────────────────────────────────────────────────────────────
shell_integration enabled
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
notify_on_cmd_finish invisible 10.0

# ──────────────────────────────────────────────────────────────
# 快捷键
#   kitty_mod = Ctrl+Shift（kitty 默认），叠加 macOS / ghostty 习惯的 CMD 系
#   不劫持 Ctrl+a，保留给 readline
# ──────────────────────────────────────────────────────────────
kitty_mod ctrl+shift
clear_all_shortcuts no

# —— Shift+Enter 发换行（ghostty: keybind shift+enter=text:\n，Claude Code 多行）——
map shift+enter send_text all \n

# —— 分屏（对齐 ghostty：CMD+d 右，CMD+Shift+d 下，CMD+Shift+Enter zoom）——
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
map cmd+shift+enter toggle_layout stack
map cmd+shift+w     close_window
map cmd+]           next_window
map cmd+[           previous_window

# —— 分屏焦点：vim hjkl / CMD+Option+方向 ——
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down

# —— 分屏尺寸 ——
map kitty_mod+shift+h resize_window narrower
map kitty_mod+shift+l resize_window wider
map kitty_mod+shift+k resize_window taller
map kitty_mod+shift+j resize_window shorter
map kitty_mod+shift+0 resize_window reset

# —— 标签页 ——
map cmd+t       new_tab_with_cwd
map cmd+w       close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+shift+, move_tab_backward
map cmd+shift+. move_tab_forward
map cmd+shift+r set_tab_title
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# —— 提示符跳转（ghostty: cmd+up/down jump_to_prompt，依赖 shell 集成）——
map cmd+up   scroll_to_prompt -1
map cmd+down scroll_to_prompt 1
# 上一条命令的输出丢进 pager
map kitty_mod+g show_last_command_output

# —— 字号 ——
map cmd+equal change_font_size all +0.5
map cmd+minus change_font_size all -0.5
map cmd+0     change_font_size all 0

# —— 清屏 + 清回滚 ——
map cmd+k clear_terminal scrollback active

# —— 全屏（ghostty 默认 cmd+enter；保留 cmd+ctrl+f）——
map cmd+enter  toggle_fullscreen
map cmd+ctrl+f toggle_fullscreen

# —— hint：选 URL 打开 / 选路径粘贴 / 选行粘贴 ——
map kitty_mod+e   open_url_with_hints
map kitty_mod+p>f kitten hints --type path --program -
map kitty_mod+p>l kitten hints --type line --program -
map kitty_mod+p>h kitten hints --type hash --program -

# —— 回滚缓冲开进 pager ——
map kitty_mod+h>s show_scrollback

# —— 配置 ——
map cmd+comma      edit_config_file
map cmd+ctrl+comma load_config_file
